apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "joegcservices.fullname" . }}-downloader-state
  labels:
    {{- include "joegcservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-pipeline
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.dataPipeline.stateVolume.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.dataPipeline.stateVolume.size }}
