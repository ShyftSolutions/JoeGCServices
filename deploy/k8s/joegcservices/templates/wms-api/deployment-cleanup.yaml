{{/*
Dedicated cleanup pod for WMS API.
Only created when wmsApi.cleanup.separate is true (typically when
scaling wms-api to multiple replicas). Runs cleanup and sync tasks
while the main replicas handle requests only.
*/}}
{{- if .Values.wmsApi.cleanup.separate }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "joegcservices.fullname" . }}-wms-cleanup
  labels:
    {{- include "joegcservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: wms-cleanup
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "joegcservices.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: wms-cleanup
  template:
    metadata:
      labels:
        {{- include "joegcservices.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: wms-cleanup
    spec:
      containers:
        - name: wms-cleanup
          image: {{ include "joegcservices.image" (dict "registry" .Values.global.image.registry "repository" .Values.wmsApi.image.repository "tag" .Values.wmsApi.image.tag) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CONFIG_DIR
              value: "/app/config"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "joegcservices.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "joegcservices.fullname" . }}-secrets
                  key: REDIS_URL
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "joegcservices.fullname" . }}-secrets
                  key: S3_ENDPOINT
            - name: S3_BUCKET
              value: {{ .Values.minio.bucket | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "joegcservices.fullname" . }}-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "joegcservices.fullname" . }}-secrets
                  key: S3_SECRET_KEY
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_ALLOW_HTTP
              value: "true"
            - name: INGESTER_URL
              value: "http://{{ include "joegcservices.fullname" . }}-data-pipeline-ingester:8082"
            # This pod IS the cleanup leader
            - name: ENABLE_CLEANUP
              value: "true"
            - name: ENABLE_SYNC
              value: "true"
            # Disable cache warming on cleanup pod (waste of resources)
            - name: ENABLE_CACHE_WARMING
              value: "false"
            - name: ENABLE_L1_CACHE
              value: "false"
            - name: ENABLE_PREFETCH
              value: "false"
            - name: DATABASE_POOL_SIZE
              value: {{ .Values.wmsApi.env.DATABASE_POOL_SIZE | default "50" | quote }}
            - name: RUST_LOG
              value: {{ .Values.wmsApi.env.RUST_LOG | default "info" | quote }}
            - name: RUST_BACKTRACE
              value: {{ .Values.wmsApi.env.RUST_BACKTRACE | default "1" | quote }}
          resources:
            {{- toYaml .Values.wmsApi.cleanup.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
{{- end }}
